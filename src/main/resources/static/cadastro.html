<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Cofrinho Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-card">
    <h2>Cadastrar</h2>

    <form action="/public/cadastrar" method="post">

        <input type="text"
               name="username"
               placeholder="Usuário"
               required>

        <input type="password"
               name="password"
               placeholder="Senha"
               required>

        <input type="text"
               name="palavraChave"
               placeholder="Palavra-chave"
               required>

        <button type="submit">Cadastrar</button>

    </form>
</div>
</body>
</html>
